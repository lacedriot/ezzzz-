        #enter-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;

            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1s ease;
        }
