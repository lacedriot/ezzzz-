<!DOCTYPE html>
<html>
<head>
    <title>RIOT</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- GLOBAL --- */
        body { 
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Sans-Serif;
            color: #FFF;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            transition: background 1s ease;
        }

        a {
            color: #FFF;
            text-decoration: none; 
        }

        /* --- SCREEN 1 (CLICK TO ENTER) --- */
        #enter-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url("https://i.pinimg.com/736x/63/e4/4b/63e44b28204cf102df46188e5858d8a6.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            z-index: 10000;
            transition: opacity 0.8s ease;
        }

        /* --- SCREEN 2 (PROFILE CARD) --- */
        #profile-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url("https://i.pinimg.com/736x/63/e4/4b/63e44b28204cf102df46188e5858d8a6.jpg") no-repeat center center fixed;
            background-size: cover;
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px 40px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .app-card pre {
            margin: 0;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Snowflakes */
        .snowflake {
            color: #738d76;
            font-size: 1.5em;
            text-shadow: 0 0 14px white;
            position: fixed;
            top: -10%;
            z-index: 999;
            animation: snowflakes-fall 10s linear infinite, snowflakes-shake 3s ease-in-out infinite;
        }

        @keyframes snowflakes-fall { 0% { top: -10% } 100% { top: 100% } }
        @keyframes snowflakes-shake { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(80px) } }
    </style>
</head>
<body>

    <!-- SCREEN 1 -->
    <div id="enter-screen" onclick="enterSite()">
        click to enter...
    </div>

    <!-- SCREEN 2 -->
    <div id="profile-screen">
        <div class="snowflakes">
            <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
            <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
            <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
            <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
        </div>

        <div class="content-container">
            <div class="app-card">
                <img src="https://i.scdn.co/image/ab67616d0000b2732ddecda1ed612a0159a53e7f">

                <pre>
<a href="https://discord.gg" target="_blank"> RIOT </a>

<a href="https://roblox.com" target="_blank"> roblox </a> 
<a href="https://steamcommunity.com" target="_blank"> steam </a>
<a href="https://rockstargames.com" target="_blank"> rockstar Social Club </a>
<a href="https://spotify.com" target="_blank"> spotify </a>
                </pre>
            </div>
        </div>
    </div>

    <script>
        /* MUSIC SYSTEM */
        var songs = [
            "worry (Slowed).mp3",
            "starly (Slowed) (1).mp3", 
            "akiaura, LONOWN - Deathwish.mp3"
        ];

        var audioPlayer = new Audio();
        audioPlayer.volume = 0.1;

        function playRandomSong() {
            var randomIndex = Math.floor(Math.random() * songs.length);
            audioPlayer.src = songs[randomIndex];
            audioPlayer.play();
        }

        audioPlayer.onended = function() {
            playRandomSong();
        };

        /* ENTER TRANSITION */
        function enterSite() {
            let enter = document.getElementById("enter-screen");
            let profile = document.getElementById("profile-screen");

            enter.style.opacity = "0";

            setTimeout(() => {
                enter.style.display = "none";
                profile.style.display = "block";

                setTimeout(() => {
                    profile.style.opacity = "1";
                }, 50);

                playRandomSong();
            }, 800);
        }
    </script>

</body>
</html>
