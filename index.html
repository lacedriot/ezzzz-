<!DOCTYPE html>
<html>
<head>
    <title>RIOT</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Sans-Serif;
            color: #FFF;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        a {
            color: #FFF;
            text-decoration: none; 
        }

        /* Snowflake Animation Logic */
        .snowflake {
            color: #738d76;
            font-size: 1.5em;
            text-shadow: 0 0 14px white;
            position: fixed;
            top: -10%;
            z-index: 999;
            animation: snowflakes-fall 10s linear infinite, snowflakes-shake 3s ease-in-out infinite;
        }

        @keyframes snowflakes-fall { 0% { top: -10% } 100% { top: 100% } }
        @keyframes snowflakes-shake { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(80px) } }

        /* Spread them out across the screen */
        .snowflake:nth-of-type(0) { left: 1%; animation-delay: 0s, 0s; }
        .snowflake:nth-of-type(1) { left: 10%; animation-delay: 1s, 1s; }
        .snowflake:nth-of-type(2) { left: 20%; animation-delay: 6s, .5s; }
        .snowflake:nth-of-type(3) { left: 30%; animation-delay: 4s, 2s; }
        .snowflake:nth-of-type(4) { left: 40%; animation-delay: 2s, 2s; }
        .snowflake:nth-of-type(5) { left: 50%; animation-delay: 8s, 3s; }
        .snowflake:nth-of-type(6) { left: 60%; animation-delay: 6s, 2s; }
        .snowflake:nth-of-type(7) { left: 70%; animation-delay: 2.5s, 1s; }
        .snowflake:nth-of-type(8) { left: 80%; animation-delay: 1s, 0s; }
        .snowflake:nth-of-type(9) { left: 90%; animation-delay: 3s, 1.5s; }
        .snowflake:nth-of-type(10) { left: 25%; animation-delay: 2s, 0s; }
        .snowflake:nth-of-type(11) { left: 65%; animation-delay: 4s, 2.5s; }

        #backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 10000; cursor: pointer;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="backdrop" onclick="start()">
        <div style="font-size: 30px;">click to proceed</div>
    </div>

    <div class="snowflakes">
        <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
        <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
        <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
        <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
    </div>

    <div class="content-container">
        <img src="riot-logo.jpg" width="50" style="margin-bottom: 20px;">
        <pre>
<a href="https://discord.gg" target="_blank"> RIOT </a>

<a href="https://roblox.com" target="_blank"> roblox </a> 
<a href="https://steamcommunity.com" target="_blank"> steam </a>
<a href="https://rockstargames.com" target="_blank"> rockstar Social Club </a>
<a href="https://spotify.com" target="_blank"> spotify </a>
        </pre>
    </div>

    <script>
        function start() {
            document.getElementById('backdrop').style.display = 'none';
            var audio = new Audio("worry (Slowed).mp3");
            audio.volume = 0.1;
            audio.loop = true;
            audio.play();
        }
    </script>
</body>
</html>
