<!DOCTYPE html>
<html>
<head>
    <title>RIOT</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:site_name" content="^_^">
    <meta property="og:title" content="ri0t.vip">
    <style>
        body { 
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Sans-Serif;
            color: #FFF;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            background: #000;
        }

        a {
            color: #FFF;
            text-decoration: none; 
        }

        /* CLICK TO ENTER SCREEN */
        #enter-screen {
            position: fixed;
            inset: 0;
            background: url("https://i.pinimg.com/736x/63/e4/4b/63e44b28204cf102df46188e5858d8a6.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1.2s ease;
        }

        /* PROFILE SCREEN */
        #profile-screen {
            position: fixed;
            inset: 0;
            background: url("https://i.pinimg.com/736x/63/e4/4b/63e44b28204cf102df46188e5858d8a6.jpg") center/cover no-repeat;
            display: flex;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .content-container {
            margin: auto;
            text-align: center;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px 40px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(255,255,255,0.15);
            display: inline-block;
        }

        .app-card img.profile {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
              
        }

        /* ICON ROW — PERFECT ALIGNMENT */
        .icon-row {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 18px;
        }

        .icon-row a {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-row img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.4));
            transition: transform 0.2s ease;
        }

        .icon-row img:hover {
            transform: scale(1.2);
        }

        /* SNOWFLAKES */
        .snowflake {
            color: #738d76;
            font-size: 1.5em;
            text-shadow: 0 0 14px white;
            position: fixed;
            top: -10%;
            z-index: 999;
            animation: snowflakes-fall 10s linear infinite, snowflakes-shake 3s ease-in-out infinite;
        }

        @keyframes snowflakes-fall { 0% { top: -10% } 100% { top: 100% } }
        @keyframes snowflakes-shake { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(80px) } }

        .snowflake:nth-of-type(1) { left: 5%; animation-delay: 0s; }
        .snowflake:nth-of-type(2) { left: 15%; animation-delay: 2s; }
        .snowflake:nth-of-type(3) { left: 25%; animation-delay: 4s; }
        .snowflake:nth-of-type(4) { left: 35%; animation-delay: 1s; }
        .snowflake:nth-of-type(5) { left: 45%; animation-delay: 3s; }
        .snowflake:nth-of-type(6) { left: 55%; animation-delay: 5s; }
        .snowflake:nth-of-type(7) { left: 65%; animation-delay: 1.5s; }
        .snowflake:nth-of-type(8) { left: 75%; animation-delay: 2.5s; }
        .snowflake:nth-of-type(9) { left: 85%; animation-delay: 4.5s; }
        .snowflake:nth-of-type(10) { left: 95%; animation-delay: 3.5s; }
    </style>
</head>
<body>

    <!-- CLICK TO ENTER -->
    <div id="enter-screen" onclick="enterSite()">
        click to enter...
    </div>

    <!-- PROFILE SCREEN -->
    <div id="profile-screen">

        <div class="snowflakes">
            <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
            <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
            <div class="snowflake">$</div><div class="snowflake">$</div><div class="snowflake">$</div>
            <div class="snowflake">$</div>
        </div>

        <div class="content-container">
            <div class="app-card">

                <!-- TYPING NAME FIXED -->
                <div class="riot-wrapper">
                    <a href="https://discord.com/channels/@me" target="_blank">
                        <div class="riot-name">RIOT</div>
                    </a>
                </div>

                <img class="profile" src="https://i.scdn.co/image/ab67616d0000b2732ddecda1ed612a0159a53e7f">

                <!-- ICONS -->
                <div class="icon-row">

                    <a href="https://www.roblox.com/users/8070884920/profile" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Roblox_Logo_2022.jpg">
                    </a>

                    <a href="https://steamcommunity.com/profiles/76561199607214938/" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg">
                    </a>

                    <a href="https://socialclub.rockstargames.com/member/ZonedRiot/games" target="_blank">
                        <img src="https://e7.pngegg.com/pngimages/42/818/png-clipart-grand-theft-auto-v-grand-theft-auto-san-andreas-rockstar-games-grand-theft-auto-iv-black-white-game-logo-miscellaneous-game.png">
                    </a>

                    <a href="https://open.spotify.com/user/31tidzohkxowulm5z5oja3u2gfya" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
                    </a>

                </div>

            </div>
        </div>
    </div>

    <script>
        /* MUSIC */
        var songs = [
            "worry (Slowed).mp3",
            "starly (Slowed) (1).mp3", 
            "akiaura, LONOWN - Deathwish.mp3"
        ];

        var audioPlayer = new Audio();
        audioPlayer.volume = 0.1;

        function playRandomSong() {
            var randomIndex = Math.floor(Math.random() * songs.length);
            audioPlayer.src = songs[randomIndex];
            audioPlayer.play();
        }

        audioPlayer.onended = function() {
            playRandomSong();
        };

        /* FADE TRANSITION — NO WHITE FLASH */
        function enterSite() {
            let enter = document.getElementById("enter-screen");
            let profile = document.getElementById("profile-screen");

            enter.style.opacity = "0";

            setTimeout(() => {
                enter.style.display = "none";
                profile.style.opacity = "1";
                playRandomSong();
            }, 1200);
        }
    </script>

</body>
</html>
